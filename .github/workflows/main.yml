name: Build Android APK from HTML

on:
  push:
    branches: [ "main", "master" ] # Запустится автоматически, когда вы обновляете код
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Node.js (needed for compiler)
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install Cordova Compiler
      run: npm install -g cordova

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Create Mobile Project and Build APK
      run: |
        cordova create build-folder com.iskra.messenger "IskraMessenger"
        cd build-folder
        cordova platform add android
        rm -rf www/*
        cp -r ../* www/ || true
        rm -rf www/build-folder
        cordova build android --debug

    - name: Upload Finished APK File
      uses: actions/upload-artifact@v4
      with:
        name: Iskra-Messenger-APK
        path: build-folder/platforms/android/app/build/outputs/apk/debug/app-debug.apk
